[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-injection-eval"
version = "0.1.0"
description = "Dockerized, deterministic benchmark for indirect prompt injection against MCP tool-using agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Jaiswal" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mcpinj = "mcpinj.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]
